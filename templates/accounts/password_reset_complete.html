{% extends 'base.html' %}

{% block content %}
<div class="w-full min-h-[calc(100vh-140px)] flex items-center justify-center py-6 px-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200/80 mx-auto p-6 sm:p-8 text-center space-y-4">
        
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-2xl ring-4 ring-emerald-50 shadow-sm">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <div class="space-y-1">
            <h2 class="text-xl font-black text-slate-900">Password Reset Complete!</h2>
            <p class="text-xs text-slate-600 leading-relaxed font-medium">
                Your password has been successfully reset. You can now use your new credentials to log in.
            </p>
        </div>

        <div class="pt-2">
            <a href="{% url 'login' %}" class="w-full inline-flex items-center justify-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-md">
                <i class="fa-solid fa-right-to-bracket text-xs"></i>
                <span>Sign In to Portal</span>
            </a>
        </div>

    </div>
</div>
{% endblock %}
