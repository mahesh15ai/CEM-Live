{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="w-full min-h-[calc(100vh-140px)] flex items-center justify-center py-6 px-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200/80 mx-auto">
        
        <!-- Header -->
        <div class="bg-brand-600 px-6 py-5 text-center text-white relative">
            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center p-1.5 mx-auto mb-2 shadow-md ring-4 ring-white/20">
                <i class="fa-solid fa-key text-brand-600 text-lg"></i>
            </div>
            <h2 class="text-xl font-black tracking-tight">Forgot Password</h2>
            <p class="text-brand-100 text-[11px] font-medium">Students, Teachers & Faculty</p>
        </div>

        <!-- Body -->
        <div class="p-6 sm:p-7 space-y-4">
            <p class="text-xs text-slate-600 leading-relaxed text-center font-medium">
                Enter your registered college email address. We'll send you a secure link to reset your account password.
            </p>

            <form method="POST" class="space-y-3.5">
                {% csrf_token %}
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 uppercase mb-1">Registered Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email" class="w-full pl-10 pr-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none transition-all shadow-sm" required placeholder="your.email@example.com">
                    </div>
                </div>

                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-xl transition shadow-md hover:shadow-lg flex items-center justify-center space-x-2 text-sm mt-2">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                    <span>Send Password Reset Link</span>
                </button>
            </form>

            <div class="pt-3 text-center border-t border-slate-100">
                <a href="{% url 'login' %}" class="text-xs font-bold text-slate-500 hover:text-brand-600 transition inline-flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Return to Portal Login</span>
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
