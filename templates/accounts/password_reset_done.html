{% extends 'base.html' %}

{% block content %}
<div class="w-full min-h-[calc(100vh-140px)] flex items-center justify-center py-6 px-4">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200/80 mx-auto p-6 sm:p-8 text-center space-y-4">
        
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-2xl ring-4 ring-emerald-50 shadow-sm">
            <i class="fa-solid fa-envelope-circle-check"></i>
        </div>

        <div class="space-y-1">
            <h2 class="text-xl font-black text-slate-900">Check Your Email</h2>
            <p class="text-xs text-slate-600 leading-relaxed font-medium">
                If an account exists with the email you submitted, we have sent a secure password reset link.
            </p>
        </div>

        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-[11px] text-slate-500">
            Please check your <strong>Inbox</strong> and <strong>Spam/Junk folder</strong>.
        </div>

        <div class="pt-2">
            <a href="{% url 'login' %}" class="w-full inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Back to Login</span>
            </a>
        </div>

    </div>
</div>
{% endblock %}
